name: contributions

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - assets/activity.svg
      - assets/activity.png

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render recent activity
        env:
          # Classic PAT with the repo scope. Private pushes and merges show up only when this is set.
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: python scripts/render_contributions.py
      - name: Commit activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity.svg assets/activity.png
          git diff --cached --quiet && exit 0
          git commit -m "update recent activity"
          git push
